name: Sync HTML to presentations

on:
  push:
    branches: [main]
    paths: ['**.html']

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push HTML files to presentations repo
        env:
          PAT: ${{ secrets.PRESENTATIONS_PAT }}
        run: |
          git config --global user.email "bway@burnsmcd.com"
          git config --global user.name "Brian Way"

          git clone https://x-access-token:${PAT}@github.com/bway75/presentations.git /tmp/presentations

          find . -maxdepth 1 -name "*.html" -exec cp {} /tmp/presentations/ \;

          cd /tmp/presentations
          git add -A
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "sync: update from pm-process"
          git push
